<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moondrag - Mystical Crypto Casino</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                    },
                    colors: {
                        gold: '#D4AF37',
                        goldlight: '#F3E5AB',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0B061A;
            /* Фоновое изображение звездного неба */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(20, 10, 40, 0.4) 0%, rgba(5, 2, 10, 0.9) 100%),
                url('https://images.unsplash.com/photo-1534796636918-a1d56a06cc52?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #E2E8F0;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Эффект матового стекла для главного контейнера */
        .glass-container {
            background: rgba(15, 10, 30, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(212, 175, 55, 0.05);
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Стеклянные панели внутри */
        .glass-panel {
            background: rgba(20, 15, 40, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .gold-glow-text {
            color: #F3E5AB;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* Меню навигации */
        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-item:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .nav-active {
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        /* Лунный круг по центру */
        .moon-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFFDE7 0%, #FFF59D 40%, rgba(212,175,55,0.1) 80%);
            box-shadow: 0 0 50px #FFF59D, 0 0 100px rgba(212,175,55,0.4);
            position: relative;
            margin: 0 auto 20px auto;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        /* Внешнее кольцо для луны (символы) */
        .astrology-ring {
            position: absolute;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            border: 1px dashed rgba(212, 175, 55, 0.5);
            border-radius: 50%;
            animation: spin 60s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Мистические карточки игр */
        .mystic-card {
            background: linear-gradient(180deg, rgba(30, 20, 60, 0.6) 0%, rgba(10, 5, 20, 0.8) 100%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 8px;
            aspect-ratio: 3/4;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .mystic-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .mystic-card::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 4px;
            pointer-events: none;
        }

        /* Кастомный скролл */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 2px; }
    </style>
</head>
<body>

    <!-- Главная рамка -->
    <div class="glass-container">
        
        <!-- Header -->
        <header class="h-[70px] border-b border-gold/20 flex items-center justify-between px-8 bg-black/20">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full border border-gold flex items-center justify-center shadow-[0_0_10px_rgba(212,175,55,0.5)]">
                    <span class="text-gold font-serif text-lg">M</span>
                </div>
                <div class="font-serif text-2xl tracking-widest gold-glow-text">Moondrag</div>
            </div>
            <div class="flex gap-4 text-gold/60 font-serif text-sm">
                <span>♊</span>
                <span>♈</span>
                <span>♋</span>
                <span>♍</span>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <!-- Sidebar -->
            <aside class="w-[220px] p-4 flex flex-col gap-6 overflow-y-auto border-r border-gold/20">
                
                <div class="glass-panel p-2 mt-4">
                    <div class="nav-item nav-active">
                        <div class="flex items-center gap-3">
                            <span class="text-gold">✪</span>
                            <span class="font-serif text-sm text-goldlight">Casino</span>
                        </div>
                        <span class="text-gold text-xs">★</span>
                    </div>
                    <div class="nav-item">
                        <div class="flex items-center gap-3">
                            <span class="text-gold/50">⚽</span>
                            <span class="font-serif text-sm text-white/70">Sports</span>
                        </div>
                        <span class="text-gold/50 text-xs">★</span>
                    </div>
                </div>

                <div class="glass-panel p-2">
                    <div class="nav-item">
                        <div class="flex items-center gap-3">
                            <span class="text-gold/50">⚔</span>
                            <span class="font-serif text-sm text-white/70">Cybersports</span>
                        </div>
                        <span class="text-gold/50 text-xs">★</span>
                    </div>
                    <div class="nav-item">
                        <div class="flex items-center gap-3">
                            <span class="text-gold/50">♚</span>
                            <span class="font-serif text-sm text-white/70">VIP Club</span>
                        </div>
                        <span class="text-gold/50 text-xs">★</span>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="flex-1 p-8 overflow-y-auto relative">
                
                <!-- Central Banner (Moon) -->
                <div class="glass-panel p-10 flex flex-col items-center justify-center mb-10 relative max-w-3xl mx-auto">
                    <div class="moon-circle">
                        <div class="astrology-ring"></div>
                    </div>
                    <h1 class="font-serif text-4xl mt-6 gold-glow-text tracking-wide">Welcome to Moondrag</h1>
                </div>

                <!-- Games Grid -->
                <h2 class="font-serif text-xl mb-6 text-goldlight tracking-wider">Drelymioriss (Top Games)</h2>
                
                <div class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                    <!-- Mystic Card 1 -->
                    <div class="mystic-card flex flex-col items-center justify-center p-4">
                        <div class="w-12 h-12 rounded-full bg-blue-900/50 border border-blue-400/50 mb-3 flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(59,130,246,0.5)]">🌌</div>
                        <span class="font-serif text-[10px] text-center text-gold/80 uppercase">Cosmic Fortune</span>
                    </div>

                    <!-- Mystic Card 2 -->
                    <div class="mystic-card flex flex-col items-center justify-center p-4">
                        <div class="w-12 h-12 rounded-full bg-red-900/50 border border-red-400/50 mb-3 flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(239,68,68,0.5)]">👁</div>
                        <span class="font-serif text-[10px] text-center text-gold/80 uppercase">Oracle's Vision</span>
                    </div>

                    <!-- Mystic Card 3 -->
                    <div class="mystic-card flex flex-col items-center justify-center p-4">
                        <div class="w-12 h-12 rounded-full bg-amber-900/50 border border-amber-400/50 mb-3 flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(245,158,11,0.5)]">⚖</div>
                        <span class="font-serif text-[10px] text-center text-gold/80 uppercase">Golden Scales</span>
                    </div>

                    <!-- Mystic Card 4 -->
                    <div class="mystic-card flex flex-col items-center justify-center p-4">
                        <div class="w-12 h-12 rounded-full bg-purple-900/50 border border-purple-400/50 mb-3 flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(168,85,247,0.5)]">🔮</div>
                        <span class="font-serif text-[10px] text-center text-gold/80 uppercase">Astral Gateway</span>
                    </div>
                    
                    <!-- Mystic Card 5 -->
                    <div class="mystic-card flex flex-col items-center justify-center p-4">
                        <div class="w-12 h-12 rounded-full bg-emerald-900/50 border border-emerald-400/50 mb-3 flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(16,185,129,0.5)]">🐉</div>
                        <span class="font-serif text-[10px] text-center text-gold/80 uppercase">Dragon's Hoard</span>
                    </div>

                    <!-- Mystic Card 6 -->
                    <div class="mystic-card flex flex-col items-center justify-center p-4">
                        <div class="w-12 h-12 rounded-full bg-indigo-900/50 border border-indigo-400/50 mb-3 flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(99,102,241,0.5)]">⚡</div>
                        <span class="font-serif text-[10px] text-center text-gold/80 uppercase">Storm Caller</span>
                    </div>
                </div>

            </main>
        </div>
    </div>

</body>
</html>
