<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moondrag - Premium Crypto Casino</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                    },
                    colors: {
                        gold: '#D4AF37',
                        goldlight: '#F3E5AB',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #030305;
            /* Единый высококачественный фон глубокого космоса */
            background-image: 
                linear-gradient(rgba(3, 3, 5, 0.6), rgba(3, 3, 5, 0.9)), 
                url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #E2E8F0;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Основной контейнер из матового стекла */
        .glass-container {
            background: rgba(10, 8, 20, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(212, 175, 55, 0.05);
            width: 100%;
            max-width: 1300px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Элементы меню и панели */
        .glass-panel {
            background: rgba(15, 12, 30, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .gold-glow-text {
            color: #F3E5AB;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-item:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.2);
        }

        .nav-active {
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }

        /* Главный баннер */
        .hero-banner {
            background: linear-gradient(135deg, rgba(20, 15, 40, 0.7) 0%, rgba(10, 8, 20, 0.9) 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: inset 0 0 40px rgba(212, 175, 55, 0.05), 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Карточки игр */
        .mystic-card {
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            aspect-ratio: 2/3;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: pointer;
            background-color: #0A0A10;
        }

        .mystic-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            transition: opacity 0.4s ease, transform 0.4s ease;
            filter: grayscale(20%) sepia(20%) hue-rotate(220deg);
        }

        .mystic-card:hover {
            transform: translateY(-6px);
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6), 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .mystic-card:hover img {
            opacity: 1;
            transform: scale(1.05);
            filter: none;
        }

        .card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px 12px 12px;
            background: linear-gradient(to top, rgba(5,5,10,0.95) 0%, rgba(5,5,10,0) 100%);
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            color: #F3E5AB;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); }
    </style>
</head>
<body>

    <div class="glass-container">
        <!-- Header -->
        <header class="h-[80px] border-b border-gold/15 flex items-center justify-between px-10">
            <div class="flex items-center gap-4">
                <div class="font-serif text-3xl tracking-[0.2em] gold-glow-text">MOONDRAG</div>
            </div>
            <div class="flex gap-6 text-gold/60 font-serif text-lg">
                <span>♊</span><span>♈</span><span>♋</span><span>♍</span>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <!-- Sidebar -->
            <aside class="w-[260px] p-6 flex flex-col gap-6 overflow-y-auto border-r border-gold/15">
                <div class="glass-panel p-3 mt-4">
                    <div class="nav-item nav-active">
                        <div class="flex items-center gap-4">
                            <span class="text-gold text-lg">✦</span>
                            <span class="font-serif text-sm text-goldlight tracking-widest uppercase">Casino</span>
                        </div>
                    </div>
                    <div class="nav-item">
                        <div class="flex items-center gap-4">
                            <span class="text-gold/40 text-lg">✦</span>
                            <span class="font-serif text-sm text-white/60 tracking-widest uppercase">Sports</span>
                        </div>
                    </div>
                </div>

                <div class="glass-panel p-3">
                    <div class="nav-item">
                        <div class="flex items-center gap-4">
                            <span class="text-gold/40 text-lg">✦</span>
                            <span class="font-serif text-sm text-white/60 tracking-widest uppercase">Cybersports</span>
                        </div>
                    </div>
                    <div class="nav-item">
                        <div class="flex items-center gap-4">
                            <span class="text-gold/40 text-lg">✦</span>
                            <span class="font-serif text-sm text-white/60 tracking-widest uppercase">VIP Club</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="flex-1 p-10 overflow-y-auto">
                
                <!-- Hero Banner -->
                <div class="hero-banner rounded-2xl p-16 flex flex-col items-center justify-center mb-12 relative max-w-5xl mx-auto overflow-hidden">
                    <!-- Легкое золотое свечение на фоне баннера -->
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent to-gold/5 pointer-events-none"></div>
                    
                    <h1 class="font-serif text-5xl md:text-6xl gold-glow-text tracking-[0.15em] uppercase text-center relative z-10">
                        Welcome to Moondrag
                    </h1>
                    <p class="mt-6 text-gold/70 font-sans text-lg tracking-widest uppercase relative z-10">
                        Unlock Cosmic Rewards
                    </p>
                    <button class="mt-8 px-10 py-3 border border-gold/50 text-goldlight font-serif uppercase tracking-widest text-sm hover:bg-gold/10 transition-all rounded-sm relative z-10">
                        Enter the Void
                    </button>
                </div>

                <!-- Games Grid -->
                <h2 class="font-serif text-xl mb-8 text-gold/80 tracking-[0.15em] uppercase text-center md:text-left">
                    Drelymioriss Collection
                </h2>
                
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5">
                    <div class="mystic-card">
                        <img src="https://images.unsplash.com/photo-1618472609777-b038f1f04b8d?q=80&w=400&auto=format&fit=crop" alt="Game">
                        <div class="card-title">Cosmic Fortune</div>
                    </div>
                    <div class="mystic-card">
                        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=400&auto=format&fit=crop" alt="Game">
                        <div class="card-title">Oracle's Vision</div>
                    </div>
                    <div class="mystic-card">
                        <img src="https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=400&auto=format&fit=crop" alt="Game">
                        <div class="card-title">Golden Scales</div>
                    </div>
                    <div class="mystic-card">
                        <img src="https://images.unsplash.com/photo-1534337623306-e13f163e6e12?q=80&w=400&auto=format&fit=crop" alt="Game">
                        <div class="card-title">Astral Gateway</div>
                    </div>
                    <div class="mystic-card">
                        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=400&auto=format&fit=crop" alt="Game">
                        <div class="card-title">Dragon's Hoard</div>
                    </div>
                    <div class="mystic-card">
                        <img src="https://images.unsplash.com/photo-1633519803157-7f00d35e1df1?q=80&w=400&auto=format&fit=crop" alt="Game">
                        <div class="card-title">Storm Caller</div>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
